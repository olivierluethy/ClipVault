[package]
name = "clipvault"
version = "1.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
qrcode = "0.14"
base64 = "0.22"
# Encryption at rest (Story 1.2): SQLCipher is linked by default (vendored OpenSSL, no
# system dependency). The DB is encrypted with a key from the OS keyring — see
# storage/mod.rs. A no-key connection behaves as plain SQLite (used by tests).
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
x11-clipboard = "0.9"
x11rb = "0.13"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
webp = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Virtual keystrokes for "paste directly" (simulates Ctrl+V after copy-and-hide).
enigo = "0.2"
# User-defined capture ignore rules (Settings → Capture): compiled per pass, cached.
regex = "1"

[dev-dependencies]
tempfile = "3"

